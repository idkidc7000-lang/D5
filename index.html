<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Game Hub</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: white;
        background: #090b18;
        overflow-x: hidden;
    }

    /* Animated background */
    .background {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
    }

    .orb {
        position: absolute;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.35;
        animation: float 8s infinite alternate ease-in-out;
    }

    .orb.one {
        background: #7c3cff;
        top: 10%;
        left: 10%;
    }

    .orb.two {
        background: #00d9ff;
        right: 10%;
        bottom: 10%;
        animation-delay: 2s;
    }

    @keyframes float {
        from {
            transform: translate(0, 0) scale(1);
        }
        to {
            transform: translate(80px, -50px) scale(1.3);
        }
    }

    /* Header */
    header {
        text-align: center;
        padding: 70px 20px 35px;
    }

    header h1 {
        font-size: 52px;
        margin: 0;
        animation: titleFloat 3s ease-in-out infinite;
    }

    header p {
        color: #aeb4d0;
        font-size: 18px;
    }

    @keyframes titleFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }

    /* Game grid */
    .games {
        width: min(1000px, 90%);
        margin: auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 25px;
        padding-bottom: 60px;
    }

    .game-card {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 20px;
        padding: 25px;
        text-align: center;
        backdrop-filter: blur(10px);
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .game-card:hover {
        transform: translateY(-12px) rotate(1deg);
        box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .icon {
        font-size: 55px;
    }

    .game-card h2 {
        margin: 12px 0 8px;
    }

    .game-card p {
        color: #aeb4d0;
    }

    button {
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        background: #7657ff;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
    }

    button:hover {
        background: #967dff;
        transform: scale(1.08);
    }

    /* Game window */
    #gameWindow {
        display: none;
        width: min(700px, 90%);
        margin: 0 auto 60px;
        padding: 30px;
        background: rgba(0,0,0,0.35);
        border-radius: 20px;
        text-align: center;
        animation: pop 0.35s ease;
    }

    @keyframes pop {
        from {
            opacity: 0;
            transform: scale(0.8);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    #gameArea {
        position: relative;
        height: 300px;
        margin-top: 20px;
        border-radius: 15px;
        background: #11152b;
        overflow: hidden;
    }

    #target {
        position: absolute;
        display: none;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: #ff4f81;
        cursor: pointer;
        box-shadow: 0 0 20px #ff4f81;
        animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
        from { transform: scale(0.85); }
        to { transform: scale(1.15); }
    }

    #number {
        font-size: 70px;
        margin: 30px;
    }

    footer {
        text-align: center;
        padding: 30px;
        color: #777d9d;
    }
</style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<header>
    <h1>🎮 Tiny Game Hub</h1>
    <p>Pick a tiny game. Have some fun.</p>
</header>

<section class="games">

    <div class="game-card">
        <div class="icon">🎯</div>
        <h2>Click Rush</h2>
        <p>Click the target as many times as you can.</p>
        <button onclick="startClickRush()">PLAY</button>
    </div>

    <div class="game-card">
        <div class="icon">🔢</div>
        <h2>Guess Number</h2>
        <p>Can you guess the secret number?</p>
        <button onclick="startGuess()">PLAY</button>
    </div>

    <div class="game-card">
        <div class="icon">⚡</div>
        <h2>Reaction Test</h2>
        <p>Wait for green, then click as fast as possible.</p>
        <button onclick="startReaction()">PLAY</button>
    </div>

</section>

<div id="gameWindow">
    <h2 id="gameTitle">Game</h2>
    <div id="gameContent"></div>
    <div id="gameArea">
        <div id="target"></div>
    </div>
    <br>
    <button onclick="closeGame()">Close Game</button>
</div>

<footer>
    Made with HTML, CSS & JavaScript ✨
</footer>

<script>
const windowBox = document.getElementById("gameWindow");
const title = document.getElementById("gameTitle");
const content = document.getElementById("gameContent");
const area = document.getElementById("gameArea");
const target = document.getElementById("target");

function openGame(name) {
    windowBox.style.display = "block";
    title.textContent = name;
    windowBox.scrollIntoView({ behavior: "smooth" });
}

function closeGame() {
    windowBox.style.display = "none";
    target.style.display = "none";
}

/* CLICK RUSH */
let clicks = 0;
let timer;

function startClickRush() {
    openGame("🎯 Click Rush");

    clicks = 0;
    let time = 10;

    content.innerHTML =
        "Clicks: <b id='score'>0</b> | Time: <b id='time'>10</b> seconds";

    area.style.display = "block";
    target.style.display = "block";

    moveTarget();

    clearInterval(timer);

    timer = setInterval(() => {
        time--;
        document.getElementById("time").textContent = time;

        if (time <= 0) {
            clearInterval(timer);
            target.style.display = "none";
            content.innerHTML =
                "🎉 Final score: <b>" + clicks + "</b> clicks!";
        }
    }, 1000);
}

target.onclick = function() {
    clicks++;
    const score = document.getElementById("score");

    if (score) {
        score.textContent = clicks;
    }

    moveTarget();
};

function moveTarget() {
    const maxX = area.clientWidth - 45;
    const maxY = area.clientHeight - 45;

    target.style.left = Math.random() * maxX + "px";
    target.style.top = Math.random() * maxY + "px";
}


/* GUESSING GAME */
function startGuess() {
    openGame("🔢 Guess Number");

    area.style.display = "none";

    let secret = Math.floor(Math.random() * 20) + 1;

    content.innerHTML = `
        <p>I'm thinking of a number from 1 to 20.</p>
        <input id="guessInput" type="number"
               min="1" max="20"
               style="padding:10px;border-radius:8px;border:0;">
        <button onclick="checkGuess(${secret})">Guess</button>
        <p id="guessResult"></p>
    `;
}

function checkGuess(secret) {
    const value = Number(document.getElementById("guessInput").value);
    const result = document.getElementById("guessResult");

    if (!value) {
        result.textContent = "Enter a number!";
    } else if (value === secret) {
        result.textContent = "🎉 Correct! You got it!";
    } else if (value < secret) {
        result.textContent = "⬆️ Too low!";
    } else {
        result.textContent = "⬇️ Too high!";
    }
}


/* REACTION TEST */
function startReaction() {
    openGame("⚡ Reaction Test");

    area.style.display = "block";

    content.innerHTML =
        "<p>Wait for the box to turn green...</p>";

    area.style.background = "#11152b";

    target.style.display = "none";

    const delay = Math.random() * 3000 + 1500;

    setTimeout(() => {
        area.style.background = "#19d36b";
        content.innerHTML =
            "<p>🟢 CLICK NOW!</p>";

        const start = Date.now();

        area.onclick = function reactionClick() {
            const reaction = Date.now() - start;

            content.innerHTML =
                "⚡ Your reaction time: <b>" +
                reaction +
                " ms</b>";

            area.style.background = "#11152b";
            area.onclick = null;
        };
    }, delay);
}
</script>

</body>
  </html>
