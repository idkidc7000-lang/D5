<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Wichtig für mobile Browser 2016 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Game Hub 2016</title>
    <style>
        /* Klassischer 2016 Material/Flat-Stil ohne CSS-Variablen und ohne CSS-Grid */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ECEFF1;
            color: #263238;
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            font-weight: bold;
            color: #1976D2;
        }

        .subtitle {
            font-size: 13px;
            color: #757575;
            margin-top: 5px;
        }

        /* 2016 Layout-Lösung: Flexbox/Float-Fallback statt CSS Grid */
        .hub-container {
            max-width: 600px;
            margin: 0 auto;
            display: block;
        }

        .game-card {
            background-color: #FFFFFF;
            border-radius: 2px;
            padding: 20px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border-top: 4px solid #2196F3;
            width: 45%;
            margin: 2.5%;
            display: inline-block;
            vertical-align: top;
        }

        .game-card:active {
            background-color: #F5F5F5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        /* Der Spiele-Bildschirm */
        .game-view {
            display: none;
            width: 100%;
            max-width: 500px;
            background-color: #FFFFFF;
            border-radius: 2px;
            padding: 20px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            margin: 0 auto;
        }

        .btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
            box-shadow: 0 2px 2px rgba(0,0,0,0.2);
            margin: 5px;
        }

        .btn:active {
            background-color: #1E88E5;
        }

        .btn-back {
            background-color: #607D8B;
        }

        #game-area {
            margin-top: 15px;
            min-height: 200px;
        }

        canvas {
            background-color: #000;
            display: block;
            margin: 0 auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Tic-Tac-Toe mit HTML-Tabelle statt Grid */
        .ttt-table {
            margin: 0 auto;
            border-collapse: collapse;
        }

        .ttt-cell {
            width: 60px;
            height: 60px;
            background-color: #CFD8DC;
            font-size: 24px;
            font-weight: bold;
            border: 4px solid #FFFFFF;
            text-align: center;
            cursor: pointer;
        }

        input[type="number"] {
            padding: 8px;
            font-size: 16px;
            width: 90px;
            text-align: center;
            margin-bottom: 10px;
            border: 1px solid #B0BEC5;
        }
    </style>
</head>
<body>

    <!-- HUB-ANSICHT -->
    <div id="hub-view" class="hub-container">
        <header>
            <h1>Web Game Hub</h1>
            <div class="subtitle">Pure HTML5 & Vanilla JS &bull; Standard 2016</div>
        </header>
        
        <div class="game-card" onclick="loadGame(1)">🐍 Snake</div>
        <div class="game-card" onclick="loadGame(2)">❌ Tic-Tac-Toe</div>
        <div class="game-card" onclick="loadGame(3)">🍪 Cookie Clicker</div>
        <div class="game-card" onclick="loadGame(4)">🔢 Zahlen raten</div>
        <div class="game-card" onclick="loadGame(5)">⏱️ Reaktion</div>
        <div class="game-card" onclick="loadGame(6)">🪙 Münzwurf</div>
        <div class="game-card" onclick="loadGame(7)">🎨 Farb-Check</div>
        <div class="game-card" onclick="loadGame(8)">🎲 Würfel</div>
        <div class="game-card" onclick="loadGame(9)">📝 Abenteuer</div>
        <div class="game-card" onclick="loadGame(10)">🧠 Mathe-Quick</div>
    </div>

    <!-- SPIEL-ANSICHT -->
    <div id="game-view" class="game-view">
        <button class="btn btn-back" onclick="exitToHub()">Zurück</button>
        <h2 id="game-title" style="margin: 10px 0; font-weight: normal;">Spiel</h2>
        <div id="game-area"></div>
    </div>

    <script>
        var hubView = document.getElementById('hub-view');
        var gameView = document.getElementById('game-view');
        var gameTitle = document.getElementById('game-title');
        var gameArea = document.getElementById('game-area');
        var gameLoopInterval = null;

        // Globale Variablen (2016 typisch mit var deklariert)
        var clickCount = 0;
        var secretNum = 0;
        var reactState = "";
        var reactTimeout = null;
        var reactStart = 0;
        var colorMatch = false;
        var mathA = 0;
        var mathB = 0;

        function loadGame(id) {
            hubView.style.display = 'none';
            gameView.style.display = 'block';
            gameArea.innerHTML = '';
            clearInterval(gameLoopInterval);

            if (id === 1) {
                gameTitle.innerText = "Snake";
                gameArea.innerHTML = '<canvas id="snakeCanvas" width="280" height="280"></canvas><p style="font-size:11px;color:#757575;margin-top:10px;">Tippe links/rechts/oben/unten auf das Feld</p>';
                initSnake();
            } else if (id === 2) {
                gameTitle.innerText = "Tic-Tac-Toe";
                gameArea.innerHTML = '<table class="ttt-table"><tr><td class="ttt-cell" onclick="tttClick(0)"></td><td class="ttt-cell" onclick="tttClick(1)"></td><td class="ttt-cell" onclick="tttClick(2)"></td></tr><tr><td class="ttt-cell" onclick="tttClick(3)"></td><td class="ttt-cell" onclick="tttClick(4)"></td><td class="ttt-cell" onclick="tttClick(5)"></td></tr><tr><td class="ttt-cell" onclick="tttClick(6)"></td><td class="ttt-cell" onclick="tttClick(7)"></td><td class="ttt-cell" onclick="tttClick(8)"></td></tr></table>';
                window.tttCells = ["","","","","","","","",""];
            } else if (id === 3) {
                gameTitle.innerText = "Cookie Clicker";
                gameArea.innerHTML = '<button class="btn" style="font-size:40px; padding:15px; border-radius:50%;" onclick="scoreUp()">🍪</button><h3>Clicks: <span id="cCount">0</span></h3>';
                clickCount = 0;
            } else if (id === 4) {
                gameTitle.innerText = "Zahlen raten (1-20)";
                secretNum = Math.floor(Math.random() * 20) + 1;
                gameArea.innerHTML = '<input type="number" id="guessInp"><br><button class="btn" onclick="checkGuess()">Prüfen</button><p id="guessResult"></p>';
            } else if (id === 5) {
                gameTitle.innerText = "Reaktionstest";
                gameArea.innerHTML = '<button id="reactBtn" class="btn" style="background:#f44336;width:200px;height:120px;font-size:18px;" onclick="clickReact()">Warten...</button>';
                initReaction();
            } else if (id === 6) {
                gameTitle.innerText = "Münzwurf";
                gameArea.innerHTML = '<h1 id="coinRes" style="font-size:48px;margin:10px;">🪙</h1><button class="btn" onclick="flipCoin()">Werfen</button>';
            } else if (id === 7) {
                gameTitle.innerText = "Farb-Check";
                gameArea.innerHTML = '<h2 id="colorWord" style="font-size:36px;margin:10px;"></h2><button class="btn" style="background:#4CAF50;" onclick="answerColor(true)">Ja</button><button class="btn" style="background:#F44336;" onclick="answerColor(false)">Nein</button>';
                initColorMatch();
            } else if (id === 8) {
                gameTitle.innerText = "Würfel";
                gameArea.innerHTML = '<h1 id="diceRes" style="font-size:64px;margin:10px;">🎲</h1><button class="btn" onclick="rollDice()">Würfeln</button>';
            } else if (id === 9) {
                gameTitle.innerText = "Text-Abenteuer";
                gameArea.innerHTML = '<p id="advText">Du stehst im Wald vor einer Weggabelung.</p><button class="btn" onclick="adv(1)">Links gehen</button><button class="btn" onclick="adv(2)">Rechts gehen</button>';
            } else if (id === 10) {
                gameTitle.innerText = "Mathe-Quick";
                mathA = Math.floor(Math.random() * 12) + 2;
                mathB = Math.floor(Math.random() * 12) + 2;
                gameArea.innerHTML = '<p style="font-size:18px;">Was ist ' + mathA + ' x ' + mathB + '?</p><input type="number" id="mathInp"><br><button class="btn" onclick="checkMath()">Senden</button>';
            }
        }

        function exitToHub() {
            clearInterval(gameLoopInterval);
            clearTimeout(reactTimeout);
            gameArea.innerHTML = '';
            gameView.style.display = 'none';
            hubView.style.display = 'block';
        }

        /* SPIELE LOGIK */
        function scoreUp() {
            clickCount++;
            document.getElementById('cCount').innerText = clickCount;
        }

        function checkGuess() {
            var val = parseInt(document.getElementById('guessInp').value);
            var res = document.getElementById('guessResult');
            if(val === secretNum) res.innerText = "Richtig erraten!";
            else if(val < secretNum) res.innerText = "Zu niedrig!";
            else res.innerText = "Zu hoch!";
        }

        function flipCoin() {
